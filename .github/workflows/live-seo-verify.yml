name: Live production SEO verification
on:
  workflow_run:
    workflows: ["Deploy approved production website"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 5'
permissions:
  contents: read
jobs:
  verify-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify live search readiness
        run: python3 scripts/verify-live-seo.py
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-verification
          path: live-seo-report/
          retention-days: 30
