name: Deploy approved production website
on:
  push:
    branches: [main]
    paths: ['.github/pages-deployment-request.json']
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type APPROVED to deploy; indexing also requires recorded clinic and indexing approvals'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validation:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.approval == 'APPROVED')
    uses: ./.github/workflows/validate.yml
  build:
    needs: validation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.approval == 'APPROVED')
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify explicit production deployment request
        run: node scripts/verify-indexing-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          PAGES_PREVIEW: 'false'
      - run: pnpm test
        env:
          VERIFY_PAGES_PREVIEW: 'false'
      - run: pnpm seo:audit
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy approved root website
        id: deployment
        uses: actions/deploy-pages@v4
