name: Prepare production artifact — no deployment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/production-readiness.yml'
      - 'scripts/*production*'
      - 'scripts/release-artifact.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'astro.config.mjs'
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PAGES_PREVIEW: 'false'
      VERIFY_PAGES_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - name: Upload readiness bundle only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-readiness-${{ github.sha }}
          path: release/production-readiness/
          include-hidden-files: true # inventory rejects hidden/private files except .nojekyll
          if-no-files-found: error
          retention-days: 14
# Intentionally no deployment job, Pages permission, configure-pages call or custom-domain mutation.
